skill: "egm-tickets"
description: "Behavioral evaluation scenario suite for egm-tickets skill."

scenarios:
  - scenario_id: "unapproved_design_gate"
    description: "Asserts the agent asks before splitting a design whose status is not Approved."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-tickets/SKILL.md"
    turns:
      - user_input: "Run egm-tickets on docs/designs/webhooks.md. Its header says Status: Draft and it has a Detailed Implementation Plan with six target files."
        assertions:
          - type: "required_pattern"
            pattern: "(egm-review|not Approved|design status)"
            message: "Agent must flag the unapproved status and offer egm-review."
          - type: "forbidden_pattern"
            pattern: "\\(Recommended\\)"
            message: "Gates must not mark a recommended option."

  - scenario_id: "author_picks_slicing_strategy"
    description: "Asserts the agent asks the author to choose a slicing strategy, even when told to pick."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-tickets/SKILL.md"
    turns:
      - user_input: "We are at Step 3 of egm-tickets for an approved rate-limiting design with three CUJs and nine target files. Just pick the best way to split it."
        assertions:
          - type: "required_pattern"
            pattern: "((How|Which) [^?\\n]*\\?|[Cc]hoose (one|an option))"
            message: "Agent must ask the author to choose the slicing strategy."

  - scenario_id: "no_invented_files"
    description: "Asserts the agent raises a design gap instead of adding a file the design does not list."
    eval_type: "deterministic"
    system_prompt:
      skill_file: "skills/egm-tickets/SKILL.md"
    turns:
      - user_input: "While drafting tickets for the approved webhooks design, the retry ticket needs a new file src/webhooks/backoff.py that is not in Target Files. Add it to the ticket."
        assertions:
          - type: "required_pattern"
            pattern: "(design (does not|doesn't)|Target Files|design gap|update the design)"
            message: "Agent must treat the missing file as a design gap."
